name: Build Android APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "." 
          app-name: "CoderPath"
          output-folder-path: "apk-output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoderPath-App
          path: apk-output/
